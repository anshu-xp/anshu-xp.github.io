<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सिया साइबर पॉइंट | Siya Cyber Point</title>
    <style>
        :root {
            --primary: #0f4c81;
            --secondary: #f39c12;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #1a365d);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #cbd5e1;
            font-size: 1rem;
        }

        .search-container {
            max-width: 600px;
            margin: 1.5rem auto 0;
            padding: 0 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            outline: none;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .category-title {
            font-size: 1.4rem;
            margin: 2rem 0 1rem;
            color: var(--primary);
            border-left: 5px solid var(--secondary);
            padding-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .card p {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .card-btn {
            align-self: flex-start;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Modal / Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-light);
        }

        .modal h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            padding-right: 2rem;
        }

        .modal-section {
            margin-bottom: 1.2rem;
        }

        .modal-section h4 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .modal-section ul {
            list-style-type: none;
        }

        .modal-section ul li {
            position: relative;
            padding-left: 1.4rem;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }

        .modal-section ul li::before {
            content: "✔";
            position: absolute;
            left: 0;
            color: #10b981;
            font-size: 0.85rem;
        }

        footer {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: 3rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

        <p>ऑनलाइन नागरिक, बैंकिंग एवं सरकारी योजनाओं का एक विश्वसनीय केंद्र</p>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="सेवा खोजें (जैसे: आधार, पैन, आय प्रमाण पत्र)..." onkeyup="filterServices()">
        </div>
    </header>

    <main class="container" id="servicesContainer">
        <!-- Categories and Cards rendered by JavaScript -->
    </main>

    <!-- Modal Popup -->
    <div class="modal" id="serviceModal" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle"></h2>
            
            <div class="modal-section">
                <h4>उपलब्ध सुविधाएं</h4>
                <p id="modalFacility" style="color: var(--text-light); font-size: 0.95rem;"></p>
            </div>

            <div class="modal-section">
                <h4>आवश्यक दस्तावेज़</h4>
                <ul id="modalDocs"></ul>
            </div>
        </div>
    </div>

    <footer>
        <p>© सिया साइबर पॉइंट | सभी नागरिक एवं डिजिटल सेवाओं के लिए संपर्क करें</p>
    </footer>

        function renderServices(filter = "") {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            servicesData.forEach(cat => {
                const filteredItems = cat.items.filter(item => 
                    item.name.toLowerCase().includes(filter.toLowerCase()) || 
                    item.desc.toLowerCase().includes(filter.toLowerCase())
                );

                if (filteredItems.length > 0) {
                    const section = document.createElement("section");
                    
                    const title = document.createElement("h2");
                    title.className = "category-title";
                    title.textContent = cat.category;
                    section.appendChild(title);

                    const grid = document.createElement("div");
                    grid.className = "grid";

                    filteredItems.forEach(item => {
                        const card = document.createElement("div");
                        card.className = "card";
                        card.onclick = () => openModal(item);
                        card.innerHTML = `
                            <div>
                                <h3>${item.name}</h3>
                                <p>${item.desc}</p>
                            </div>
                            <span class="card-btn">विवरण व दस्तावेज़ देखें &rarr;</span>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                }
            });
        }

        function openModal(item) {
            document.getElementById("modalTitle").innerText = item.name;
            document.getElementById("modalFacility").innerText = item.facility;
            
            const docsList = document.getElementById("modalDocs");
            docsList.innerHTML = "";
            item.docs.forEach(doc => {
                const li = document.createElement("li");
                li.innerText = doc;
                docsList.appendChild(li);
            });

            document.getElementById("serviceModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("serviceModal").style.display = "none";
        }

        function closeModalOnOutsideClick(e) {
            if (e.target.id === "serviceModal") {
                closeModal();
            }
        }

        function filterServices() {
            const val = document.getElementById("searchInput").value;
            renderServices(val);
        }

        // Initial render
        renderServices();
    </script>
</body>
  </html>
